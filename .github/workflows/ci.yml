name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (PostgreSQL + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jornada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d jornada_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: jornada_test
      PGUSER: test
      PGPASSWORD: test
      MONGO_URI: mongodb://localhost:27017/jornada_test
      # Disposable CI-only value, not a real secret.
      JWT_SECRET: test-only-signing-key-0123456789abcdef
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api

  docker:
    name: Docker Compose build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use placeholder configuration
        run: cp .env.example .env
      - run: docker compose build
      - name: Start the stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health endpoint
        run: curl --fail --silent --show-error http://localhost:5000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks over the full git history
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            'git config --global --add safe.directory /repo && gitleaks git --redact -v /repo'
